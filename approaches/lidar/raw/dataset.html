(DSM) - 1m - WMTS","serviceType":"HTTP Web Resource"},{"url":"https://environment.data.gov.uk/spatialdata/survey-index-files/ogc/features/v1","name":"OGC API - Features service","id":"1fccf3d5-258e-472a-80a5-28cecba031b0","description":"OGC API - Features service","serviceType":"OGC API Features"}],"services":[],"entitlements":["read"],"isOwner":false,"derivedFrom":[],"usedBy":[],"entitlementsByIdentity":{"PUBLIC":["read"]}},"relatedDatasets":[{"description":"The LIDAR Composite DSM (Digital Surface Model) is a raster elevation model covering ~99% of England at 2m spatial resolution. The DSM (Digital Surface Model) is produced from the last or only laser pulse returned to the sensor and includes heights of objects, such as vehicles, buildings and vegetation, as well as the terrain surface  \n\nProduced by the Environment Agency in 2022, the DSM is derived from a combination of our Time Stamped archive and National LIDAR Programme surveys, which have been merged and re-sampled to give the best possible coverage. Where repeat surveys have been undertaken the newest, best resolution data is used. Where data was resampled a bilinear interpolation was used before being merged.\n\nThe 2022 LIDAR Composite contains surveys undertaken between 6th June 2000 and 2nd April 2022. Please refer to the metadata index catalgoues which show for any location which survey was used in the production of the LIDAR composite.\n\nThe data is available to download as GeoTiff rasters in 5km tiles aligned to the OS National grid. The data is presented in metres, referenced to Ordinance Survey Newlyn and using the OSTN’15 transformation method. All individual LIDAR surveys going into the production of the composite had a vertical accuracy of +/-15cm RMSE.","creator":"Environment Agency","modified":1702598400000,"workflowKeywords":["OpenData","NCEA"],"title":"LIDAR Composite Digital Surface Model (DSM) - 2m","id":"f083c5dc-504f-4428-9811-a1b2519fa279"},{"description":"The LIDAR Composite First Return DSM (Digital Surface Model) is a raster elevation model covering ~99% of England at 1m spatial resolution. The first return DSM is produced from the first or only laser pulse returned to the sensor and includes heights of objects, such as vehicles, buildings and vegetation, as well as the terrain surface where the first or only return was the ground.\n\nProduced by the Environment Agency in 2022, the first return DSM is derived from data captured as part of our national LIDAR programme between 11 November 2016 and 5th May 2022. This programme divided England into ~300 blocks for survey over continuous winters from 2016 onwards. These surveys are merged together to create the first return LIDAR composite using a feathering technique along the overlaps to remove any small differences in elevation between surveys. Please refer to the metadata index catalgoues which show for any location which survey was used in the production of the LIDAR composite.\n\nThe first return DSM will not match in coverage or extent of the LIDAR composite last return digital surface model (LZ_DSM) as the last return DSM composite is produced from both the national LIDAR programme and Timeseries surveys.\n\nThe data is available to download as GeoTiff rasters in 5km tiles aligned to the OS National grid. The data is presented in metres, referenced to Ordinance Survey Newlyn and using the OSTN’15 transformation method. All individual LIDAR surveys going into the production of the composite had a vertical accuracy of +/-15cm RMSE.","creator":"Environment Agency","modified":1702598400000,"workflowKeywords":["OpenData","NCEA"],"title":"LIDAR Composite First Return Digital Surface Model (FZ_DSM) - 1m","id":"df4e3ec3-315e-48aa-aaaf-b5ae74d7b2bb"},{"description":"The LIDAR Composite DTM (Digital Terrain Model) is a raster elevation model covering ~99% of England at 1m spatial resolution. The DTM (Digital Terrain Model) is produced from the last or only laser pulse returned to the sensor. We remove surface objects from the Digital Surface Model (DSM), using bespoke algorithms and manual editing of the data, to produce a terrain model of just the surface.\n\nProduced by the Environment Agency in 2022, the DTM is derived from a combination of our Time Stamped archive and National LIDAR Programme surveys, which have been merged and re-sampled to give the best possible coverage. Where repeat surveys have been undertaken the newest, best resolution data is used. Where data was resampled a bilinear interpolation was used before being merged.\n\nThe 2022 LIDAR Composite contains surveys undertaken between 6th June 2000 and 2nd April 2022. Please refer to the metadata index catalgoues which show for any location which survey was used in the production of the LIDAR composite.\n\nThe data is available to download as GeoTiff rasters in 5km tiles aligned to the OS National grid. The data is presented in metres, referenced to Ordinance Survey Newlyn and using the OSTN’15 transformation method. All individual LIDAR surveys going into the production of the composite had a vertical accuracy of +/-15cm RMSE. ","creator":"Environment Agency","modified":1702598400000,"workflowKeywords":["OpenData","NCEA"],"title":"LIDAR Composite Digital Terrain Model (DTM) - 1m","id":"13787b9a-26a4-4775-8523-806d13af58fc"}],"files":[{"id":"LIDAR%20Composite%20Technical%20Information%20Guide.docx","fileURI":"https://api.agrimetrics.co.uk/file-management/data-sets/8a0b69a5-a48a-4b1f-a0a8-eef7d810340e/files/LIDAR%20Composite%20Technical%20Information%20Guide.docx","name":"LIDAR Composite Technical Information Guide.docx","type":"file","size":180306,"lastModified":"2024-02-27T14:54:45.344Z","isLocked":false,"isPrivate":false,"isSystemManaged":false}],"error":null,"gdprDocument":null},"__N_SSP":true},"page":"/dataset/[datasetId]","query":{"datasetId":"9ba4d5ac-d596-445a-9056-dae3ddec0178"},"buildId":"ZK4LcvVP_Qjcri2T90Vya","isFallback":false,"isExperimentalCompile":false,"gssp":true,"appGip":true,"scriptLoader":[]}</script></body></html>
